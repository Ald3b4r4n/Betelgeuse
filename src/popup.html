<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, sans-serif; background: #1a1a2e; color: #eee; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #fff; }
    h1 .dot { color: #e94560; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .stats { background: #16213e; border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
    .stats div { display: flex; justify-content: space-between; }
    .stats b { color: #e94560; }
    .hint { font-size: 11px; color: #999; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
    .slider { position: absolute; inset: 0; background: #555; border-radius: 22px; transition: .2s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
    .switch input:checked + .slider { background: #e94560; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    a { color: #0f3460; }
    footer { margin-top: 10px; font-size: 11px; }
    footer a { color: #e94560; }
  </style>
</head>
<body>
  <h1>Betelgeuse <span class="dot">●</span></h1>
  <div class="row">
    <span>Bloqueio ativo</span>
    <label class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="stats">
    <div><span>Itens ocultados</span><b id="stat-hidden">–</b></div>
    <div><span>Pre-rolls pulados</span><b id="stat-skips">–</b></div>
    <div><span>Popups barrados</span><b id="stat-popups">–</b></div>
  </div>
  <p class="hint">Estatísticas da aba atual. Ao ligar/desligar, a aba é recarregada.</p>
  <footer><a href="https://github.com/Ald3b4r4n/Betelgeuse" target="_blank" rel="noopener">GitHub do projeto</a></footer>
  <script src="popup.js"></script>
</body>
</html>
